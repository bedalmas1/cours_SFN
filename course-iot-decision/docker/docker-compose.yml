services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: iot-decision-mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 10
