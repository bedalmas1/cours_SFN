<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 90" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="190" height="90" fill="#ffffff"/>

  <text x="95" y="8" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1a1a1a" textLength="140" lengthAdjust="spacingAndGlyphs">CHRONOLOGIE DE MAINTENANCE — VUE SCHÉMATIQUE</text>

  <line x1="115" y1="13" x2="115" y2="79" stroke="#1a1a1a" stroke-width="0.6" stroke-dasharray="1.6,1.2"/>
  <text x="115" y="11" text-anchor="middle" font-size="3.6" fill="#1a1a1a" textLength="30" lengthAdjust="spacingAndGlyphs">AUJOURD'HUI</text>

  <!-- row timelines -->
  <g stroke="#bbbbbb" stroke-width="0.4" stroke-dasharray="1,1">
    <line x1="55" y1="26" x2="175" y2="26"/>
    <line x1="55" y1="38" x2="175" y2="38"/>
    <line x1="55" y1="50" x2="175" y2="50"/>
    <line x1="55" y1="62" x2="175" y2="62"/>
    <line x1="55" y1="74" x2="175" y2="74"/>
  </g>

  <!-- row labels -->
  <g font-size="4" font-weight="bold" fill="#1a1a1a">
    <text x="4" y="27" textLength="46" lengthAdjust="spacingAndGlyphs">Poste d'observation Nord</text>
    <text x="4" y="39" textLength="46" lengthAdjust="spacingAndGlyphs">Poste frontalier allié</text>
    <text x="4" y="51" textLength="46" lengthAdjust="spacingAndGlyphs">Poste Est (hors secteur)</text>
    <text x="4" y="63" textLength="46" lengthAdjust="spacingAndGlyphs">Station d'écoute A</text>
    <text x="4" y="75" textLength="46" lengthAdjust="spacingAndGlyphs">Station d'écoute B</text>
  </g>

  <!-- Poste Nord: no data communicated -->
  <text x="95" y="28" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#8a1f1f">?</text>
  <text x="135" y="28" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#8a1f1f">?</text>

  <!-- Poste frontalier: -3 semaines / +5 semaines -->
  <circle cx="85" cy="38" r="1.8" fill="#1a1a1a"/>
  <circle cx="165" cy="38" r="1.8" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.7"/>

  <!-- Poste Est: -1 semaine / +3 semaines -->
  <circle cx="105" cy="50" r="1.8" fill="#1a1a1a"/>
  <circle cx="145" cy="50" r="1.8" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.7"/>

  <!-- Station A: -6 semaines / +6 semaines -->
  <circle cx="55" cy="62" r="1.8" fill="#1a1a1a"/>
  <circle cx="175" cy="62" r="1.8" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.7"/>

  <!-- Station B: -6 semaines / +6 semaines -->
  <circle cx="55" cy="74" r="1.8" fill="#1a1a1a"/>
  <circle cx="175" cy="74" r="1.8" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.7"/>

  <!-- legend -->
  <circle cx="10" cy="85" r="1.6" fill="#1a1a1a"/>
  <text x="13" y="86.2" font-size="3.4" fill="#1a1a1a" textLength="58" lengthAdjust="spacingAndGlyphs">dernière intervention connue</text>
  <circle cx="78" cy="85" r="1.6" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="81" y="86.2" font-size="3.4" fill="#1a1a1a" textLength="62" lengthAdjust="spacingAndGlyphs">prochaine intervention programmée</text>
  <text x="150" y="86.2" font-size="4.2" font-weight="bold" fill="#8a1f1f">?</text>
  <text x="154" y="86.2" font-size="3.4" fill="#1a1a1a" textLength="34" lengthAdjust="spacingAndGlyphs">donnée non communiquée</text>
</svg>
