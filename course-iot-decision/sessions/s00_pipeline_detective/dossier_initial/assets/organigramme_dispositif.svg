  <text x="95" y="88" text-anchor="middle" font-size="3.6" font-style="italic" fill="#4a4a4a" textLength="150" lengthAdjust="spacingAndGlyphs">Organigramme simplifié — cinq éléments rattachés au même bureau, sans hiérarchie entre eux</text>
