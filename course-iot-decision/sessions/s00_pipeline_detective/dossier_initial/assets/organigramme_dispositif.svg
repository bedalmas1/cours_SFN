<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 95" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="190" height="95" fill="#ffffff"/>

  <g transform="translate(96,12)">
