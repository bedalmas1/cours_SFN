<svg xmlns="http://www.w3.org/2000/svg" width="140mm" height="95mm" viewBox="0 0 140 95">
  <rect x="0" y="0" width="140" height="95" fill="#ffffff"/>

  <g transform="translate(70,47) rotate(-3)">
    <!-- torn scrap of paper -->
    <path d="M -58,-32
             L -30,-35 L 2,-33 L 35,-36 L 60,-32
             L 58,-14 L 61,4 L 57,20 L 60,34
             L 30,37 L -3,35 L -34,38 L -60,33
             L -57,15 L -60,-2 L -56,-18 Z"
          fill="#fbf3d8" stroke="#c9b878" stroke-width="0.4"/>

    <!-- coffee stain -->
    <circle cx="34" cy="-18" r="9" fill="none" stroke="#a9834a" stroke-width="1" opacity="0.35"/>
    <circle cx="34" cy="-18" r="6.5" fill="#a9834a" opacity="0.08"/>

    <text x="-46" y="-14" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="7.5" fill="#20232a" transform="rotate(-2)">Vérifier si l'informateur</text>
    <text x="-46" y="-3" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="7.5" fill="#20232a" transform="rotate(-2)">de l'axe secondaire est</text>
    <text x="-46" y="8" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="7.5" fill="#20232a" transform="rotate(-2)">toujours fiable —</text>
    <text x="-46" y="19" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="7.5" fill="#20232a" transform="rotate(-2)">doute émis en réunion</text>
    <text x="-46" y="30" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="7.5" fill="#20232a" transform="rotate(-2)">la semaine dernière.</text>
  </g>

  <text x="70" y="91" text-anchor="middle" font-family="Georgia, serif" font-size="3.6" font-style="italic" fill="#4a4a4a" textLength="128" lengthAdjust="spacingAndGlyphs">Pièce n° 8 — dossier initial, séquence 0. Trouvée non signée dans le dossier précédent.</text>
</svg>
